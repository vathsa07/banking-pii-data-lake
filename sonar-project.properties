# SonarQube Project Configuration
sonar.projectKey=banking-pii-data-lake
sonar.projectName=Banking PII Data Lake
sonar.projectVersion=1.0
sonar.host.url=http://sonarqube:9000

# Source directories
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src

# Test inclusions & exclusions
sonar.test.inclusions=backend/tests/test_*.py,frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,frontend/src/**/*.spec.jsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/__pycache__/**,**/dist/**,**/build/**

# Coverage reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Memory configuration for JS analyzer bridge
sonar.javascript.node.maxspace=1024

# Source encoding
sonar.sourceEncoding=UTF-8
