x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: banking-pii-airflow:latest
  environment:
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    - AIRFLOW__CORE__FERNET_KEY=46ExTH2Z6fkghUKbZsGoAThPzGF9d1BfJ0gZsF2Q8aU=
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - PYTHONPATH=/opt/airflow
    - S3_ENDPOINT_URL=http://moto-s3:5000
    - AWS_ACCESS_KEY_ID=test
    - AWS_SECRET_ACCESS_KEY=test
    - AWS_DEFAULT_REGION=us-east-1
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - HMAC_SECRET_KEY=banking_super_secret_pii_key_2026
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./governance:/opt/airflow/governance
    - ./data_generator:/opt/airflow/data_generator
    - ./powerbi_export:/opt/airflow/powerbi_export

services:
  postgres:
    image: postgres:15-alpine
    container_name: pii_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./config/postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  moto-s3:
    build:
      context: .
      dockerfile: docker/Dockerfile.moto
    image: banking-pii-moto:latest
    container_name: pii_moto_s3
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 5s
      timeout: 5s
      retries: 5

  moto-s3-init:
    <<: *airflow-common
    container_name: pii_moto_s3_init
    entrypoint: /bin/bash
    command: -c "python /opt/airflow/pipeline/s3_utils.py"
    depends_on:
      moto-s3:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: banking-pii-backend:latest
    container_name: pii_backend
    ports:
      - "8000:8000"
    environment:
      - S3_ENDPOINT_URL=http://moto-s3:5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - HMAC_SECRET_KEY=banking_super_secret_pii_key_2026
      - JWT_SECRET_KEY=banking_jwt_super_secret_key_2026
      - AIRFLOW_HTTP_URL=http://airflow-webserver:8080
    volumes:
      - ./backend:/app/backend
      - ./pipeline:/app/pipeline
      - ./governance:/app/governance
      - ./data_generator:/app/data_generator
      - ./powerbi_export:/app/powerbi_export
    depends_on:
      postgres:
        condition: service_healthy
      moto-s3:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: banking-pii-frontend:latest
    container_name: pii_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  airflow-init:
    <<: *airflow-common
    container_name: pii_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@banking.local \
          --password admin
    depends_on:
      postgres:
        condition: service_healthy
      moto-s3-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: pii_airflow_webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: pii_airflow_scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    image: banking-pii-streamlit:latest
    container_name: pii_streamlit
    ports:
      - "8501:8501"
    environment:
      - S3_ENDPOINT_URL=http://moto-s3:5000
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - HMAC_SECRET_KEY=banking_super_secret_pii_key_2026
    volumes:
      - ./app:/app/app
      - ./governance:/app/governance
      - ./pipeline:/app/pipeline
      - ./data_generator:/app/data_generator
      - ./powerbi_export:/app/powerbi_export
    depends_on:
      postgres:
        condition: service_healthy
      moto-s3:
        condition: service_healthy

  sonarqube:
    image: sonarqube:community
    container_name: pii_sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dnode.store.allow_mmap=false -Xms256m -Xmx256m
      - SONAR_WEB_JAVAADDITIONALOPTS=-Xms256m -Xmx384m
      - SONAR_CE_JAVAADDITIONALOPTS=-Xms256m -Xmx384m
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/system/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: pii_jenkins
    restart: always
    user: root
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    image: banking-pii-cron:latest
    container_name: pii_cron
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./backups:/backups
      - cron_logs:/var/log
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:
  cron_logs:


